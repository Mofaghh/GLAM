name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (меньше 15 — Render не уснёт)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service health endpoint
        run: curl -fsS -o /dev/null "https://${{ secrets.RENDER_PING_URL }}/health"
